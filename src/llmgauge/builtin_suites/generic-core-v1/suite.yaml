schema_version: llmgauge.suite.v0
suite_id: generic-core-v1
suite_version: 0.1.0
title: Generic Core v1
description: >
  Portable native-response suite for general-purpose model evaluation.
  Named profiles share one prompt inventory. Deterministic checks D1-D7
  are declared references only; this suite version does not execute them.
default_profile: core
profiles:
