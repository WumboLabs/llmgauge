[project]
name = "llmgauge"
version = "0.73.0"
description = "Practical local LLM evaluation on real hardware"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Kevin Dickinson", email = "contact@wumbocore.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.urls]
Homepage = "https://github.com/WumboLabs/llmgauge"
Repository = "https://github.com/WumboLabs/llmgauge"
Issues = "https://github.com/WumboLabs/llmgauge/issues"
Changelog = "https://github.com/WumboLabs/llmgauge/blob/main/CHANGELOG.md"

[project.scripts]
llmgauge = "llmgauge.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
